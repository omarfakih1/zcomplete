[package]
name = "zcomplete"
version = "0.1.2"
edition = "2021"
rust-version = "1.70"
description = "Frecency-ranked command resolution for zsh, bash and fish"
repository = "https://github.com/omarfakih1/zcomplete"
license = "MIT"
readme = "README.md"
keywords = ["cli", "shell", "zsh", "fish", "autocomplete"]
categories = ["command-line-utilities"]
# The pty suite needs three shells and a checkout to run at all, and CI is the
# only thing that runs it, so it is not worth shipping to someone installing
# the crate. The workflows sit under the same directory.
exclude = [".github/"]

[dependencies]
libc = "0.2.189"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
